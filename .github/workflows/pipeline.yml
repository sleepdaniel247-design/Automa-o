name: Esteira CI - Robot Framework

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─── Estágio 1: Lint / Validação ───────────────────────────────────────────
  lint:
    name: "1 · Lint & Validação"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências de lint
        run: pip install robotframework rflint

      - name: Validar sintaxe dos arquivos .robot
        run: python -m robot --dryrun --outputdir /tmp/dryrun tests/

      - name: Lint com rflint
        run: rflint tests/ resources/ || true   # aviso, não bloqueia

  # ─── Estágio 2: Instalar e cachear dependências ────────────────────────────
  install:
    name: "2 · Dependências"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar versões instaladas
        run: |
          python -m robot --version
          pip show robotframework-seleniumlibrary | grep Version

  # ─── Estágio 3: Testes (smoke) ─────────────────────────────────────────────
  test-smoke:
    name: "3a · Testes Smoke"
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Criar diretórios
        run: mkdir -p results/screenshots results/logs

      - name: Executar testes smoke
        run: |
          python -m robot \
            --outputdir results \
            --include smoke \
            --variable BROWSER:headless_chrome \
            --loglevel INFO \
            tests/
        continue-on-error: true

      - name: Upload resultados smoke
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-smoke
          path: results/
          retention-days: 7

  # ─── Estágio 4: Testes (todos) ─────────────────────────────────────────────
  test-full:
    name: "3b · Testes Completos"
    runs-on: ubuntu-latest
    needs: test-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Criar diretórios
        run: mkdir -p results/screenshots results/logs

      - name: Executar todos os testes
        run: |
          python -m robot \
            --outputdir results \
            --log results/logs/log.html \
            --report results/report.html \
            --variable BROWSER:headless_chrome \
            --loglevel DEBUG \
            --timestampoutputs \
            tests/
        continue-on-error: true

      - name: Upload resultados completos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-completos
          path: results/
          retention-days: 30

  # ─── Estágio 5: Relatório final ────────────────────────────────────────────
  report:
    name: "4 · Relatório"
    runs-on: ubuntu-latest
    needs: test-full
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Baixar resultados
        uses: actions/download-artifact@v4
        with:
          name: resultados-completos
          path: results/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar robotframework
        run: pip install robotframework

      - name: Gerar summary do pipeline
        run: |
          echo "## Relatório da Esteira CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Validação | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependências     | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Testes Smoke     | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Testes Completos | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f results/output.xml ]; then
            python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('results/output.xml')
          root = tree.getroot()
          stats = root.find('.//statistics/total/stat')
          if stats is not None:
              total = int(stats.get('pass', 0)) + int(stats.get('fail', 0))
              print(f'### Resultados dos Testes')
              print(f'- **Total:** {total}')
              print(f'- **Passaram:** {stats.get(\"pass\", 0)} ✅')
              print(f'- **Falharam:** {stats.get(\"fail\", 0)} ❌')
          " >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Artefatos (relatório HTML + screenshots) disponíveis por 30 dias." >> $GITHUB_STEP_SUMMARY
